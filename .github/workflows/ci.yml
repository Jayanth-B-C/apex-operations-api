
name: Apex Operations API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apexdb
          POSTGRES_USER: apexuser
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apexuser -d apexdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: apexdb
      DB_USER: apexuser
      DB_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint checks
        run: ruff check config operations manage.py

      - name: Run Django automated tests
        run: python manage.py test

      - name: Build Docker image
        run: |
          docker build -t apex-operations-api:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apex-operations-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
